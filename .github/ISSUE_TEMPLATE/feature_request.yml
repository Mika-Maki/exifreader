name: Feature request
description: Suggest a new container, tag family, output mode, or behavior change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Concrete metadata beats abstract wishes:
        a real-world file or a specification reference makes the request much
        easier to act on.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
        - label: This is not a security vulnerability report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - container support (JPEG / PNG / TIFF / HEIF / other)
        - TIFF parsing and field types
        - tag dictionaries and semantic decoding
        - MakerNote support
        - output format (tree / tags / JSON / summary / new)
        - command line interface
        - performance or resource limits
        - build, packaging or CI
        - documentation
        - something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should exifreader do? If it affects output, show the shape you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: Example file or reference
      description: A specimen file, a vendor document, or a link to the relevant specification.
    validations:
      required: false

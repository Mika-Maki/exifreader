name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)" CXX=${{ matrix.compiler }}

      - name: Generate test fixtures
        run: make fixtures

      - name: Run test suite
        run: ./tests/run_tests.sh build/exifreader

  strict-warnings:
    name: warnings as errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with -Werror -Wconversion
        run: |
          make -j"$(nproc)" CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror"

      - name: Run test suite
        run: ./tests/run_tests.sh build/exifreader

  cmake:
    name: cmake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cmake --parallel

      - name: Run test suite
        run: ./tests/run_tests.sh build-cmake/exifreader

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with sanitizers
        run: make debug

      - name: Run test suite
        run: ./tests/run_tests.sh build/exifreader

      - name: Smoke-test every output mode
        run: |
          set -eu
          for mode in --tree --tags --json --summary; do
            ./build/exifreader "$mode" tests/fixtures/sample.jpg >/dev/null
          done

  docs:
    name: docs and i18n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check translation coverage and jump links
        run: ./scripts/check-i18n.sh

      - name: Check documentation links and code fences
        run: ./scripts/check-docs-links.sh

  formatting:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Report formatting differences (never fails the build)
        run: |
          if make format-check; then
            echo "src/ is clang-format clean"
          else
            echo "::warning title=clang-format::src/ is not fully clang-format clean. This job is advisory - run 'make format' on the files you touch. See CONTRIBUTING.md."
          fi
